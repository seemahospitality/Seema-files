<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>SEEMA Operational Diagnostic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one calm working column (quiz) that widens into a report (results). Operational tool, not a landing page. */
:root{
  --bg:#F5F1E6;          /* ivory */
  --surface:#FBF9F3;
  --surface-2:#EFE9DA;
  --ink:#07090D;         /* SEEMA black */
  --muted:#5E5A50;
  --line:#DCD3BF;
  --gold:#946B1C;        /* gold darkened for text on ivory */
  --gold-fill:#D9A93F;   /* SEEMA gold for fills */
  --gold-soft:#F0E2BE;
  --rust:#A8532A;        /* SEEMA rust: urgent / safety */
  --rust-soft:#F3DED2;
  --ok:#3F6B4A;
  --logo:#07090D;
  --on-gold:#07090D;
  --shadow:0 1px 0 rgba(7,9,13,.04),0 8px 24px -16px rgba(7,9,13,.25);
  --f-display:"Alexandria","IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#07090D;--surface:#10131A;--surface-2:#171B24;--ink:#F5F1E6;--muted:#A9A395;--line:#272C37;
    --gold:#F0C664;--gold-fill:#D9A93F;--gold-soft:#2A2312;--rust:#D9825A;--rust-soft:#2E1A11;--ok:#8FBF98;
    --logo:#D9A93F;--on-gold:#07090D;--shadow:0 1px 0 rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#07090D;--surface:#10131A;--surface-2:#171B24;--ink:#F5F1E6;--muted:#A9A395;--line:#272C37;
  --gold:#F0C664;--gold-fill:#D9A93F;--gold-soft:#2A2312;--rust:#D9825A;--rust-soft:#2E1A11;--ok:#8FBF98;
  --logo:#D9A93F;--on-gold:#07090D;--shadow:0 1px 0 rgba(0,0,0,.4),0 10px 30px -18px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
.app{max-width:1040px;margin-inline:auto;padding-inline:16px;padding-block:12px 48px;min-height:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold-fill);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);line-height:1.35;text-wrap:balance;margin:0}
p{margin:0}
.en{font-family:var(--f-body);direction:ltr;unicode-bidi:isolate;letter-spacing:.01em}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 14px;border-bottom:1px solid var(--line);margin-bottom:20px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.lockup{height:34px;width:auto;color:var(--logo);flex:none;display:block}
.brand-tag{font-size:12px;color:var(--muted);border-inline-start:1px solid var(--line);padding-inline-start:12px;line-height:1.45}
.designation{display:none;font-size:11.5px;color:var(--muted);margin:-12px 0 18px;line-height:1.5}
.designation span{display:block;text-align:right}
h1[tabindex="-1"]:focus{outline:none}
.bar-actions{display:flex;gap:8px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;color:var(--ink)}
.ghost:hover{border-color:var(--gold-fill)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:12px 26px;font-family:var(--f-display);font-weight:600;font-size:16px;cursor:pointer;border:1px solid transparent;min-height:48px}
.btn-gold{background:var(--gold-fill);color:var(--on-gold)}
.btn-gold:hover{filter:brightness(1.06)}
.btn-gold:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn-line{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-line:hover{border-color:var(--gold-fill)}

/* start screen */
.start{max-width:720px;margin-inline:auto;display:grid;gap:28px;padding-block:24px 8px}
.eyebrow{font-size:13px;letter-spacing:.04em;color:var(--gold);font-weight:600}
.start h1{font-size:clamp(28px,6vw,42px);font-weight:700;letter-spacing:-.005em}
.lead{font-size:17px;color:var(--muted);max-width:60ch;display:grid;gap:8px}
.loop{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted);direction:ltr;justify-content:flex-end}
.loop span{border:1px solid var(--line);border-radius:4px;padding:2px 8px;letter-spacing:.08em}
.loop span.on{border-color:var(--gold-fill);color:var(--gold)}
.loop i{font-style:normal;opacity:.6}
.start-cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.demo{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface);display:grid;gap:10px}
.demo label{font-size:14px;color:var(--muted)}
.demo-row{display:flex;gap:8px;flex-wrap:wrap}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;flex:1 1 240px;min-width:0}
.philo{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

/* quiz */
.quiz{max-width:720px;margin-inline:auto;display:grid;gap:22px}
.progress{display:grid;gap:8px}
.progress-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--gold-fill);width:0;transition:width .3s ease}
.q-title{font-size:clamp(21px,4.6vw,27px);font-weight:600}
.q-help{color:var(--muted);font-size:15px;margin-top:8px}
.q-cap{font-size:13px;color:var(--gold);margin-top:6px;font-weight:600}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;text-align:start;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer;min-height:56px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--gold-fill)}
.opt[aria-pressed="true"]{border-color:var(--gold-fill);background:var(--gold-soft)}
.opt .mk{width:20px;height:20px;border:1.5px solid var(--muted);border-radius:50%;margin-top:4px;display:grid;place-items:center}
.opt.multi .mk{border-radius:5px}
.opt[aria-pressed="true"] .mk{border-color:var(--gold-fill);background:var(--gold-fill)}
.opt[aria-pressed="true"] .mk::after{content:"";width:8px;height:8px;border-radius:2px;background:var(--on-gold)}
.opt .t{font-weight:500;font-size:16px;line-height:1.55}
.opt .d{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.opt[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.matrix{display:grid;gap:12px}
.mrow{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface);display:grid;gap:10px}
.mrow legend{float:right;width:100%;font-weight:500;padding:0;margin-bottom:8px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;clear:both}
@media (max-width:520px){.seg{grid-template-columns:repeat(2,1fr)}}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 6px;font-size:14px;cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--on-gold);font-weight:600}
.q-nav{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}

/* escalation */
.esc{max-width:760px;margin-inline:auto;display:grid;gap:20px}
.esc-head{border:1px solid var(--rust);background:var(--rust-soft);border-radius:var(--r);padding:20px;display:grid;gap:8px}
.esc-head .eyebrow{color:var(--rust)}
.esc-head h1{font-size:clamp(22px,5vw,30px)}
.esc ol{margin:0;padding-inline-start:22px;display:grid;gap:10px}
.esc li::marker{color:var(--rust);font-weight:700}
.esc-block{border:1px solid var(--line);border-radius:var(--r);padding:18px;background:var(--surface);display:grid;gap:10px}
.esc-block h2{font-size:18px}

/* results */
.res{display:grid;gap:34px}
.res-head{display:grid;gap:10px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.res-head h1{font-size:clamp(26px,5vw,36px)}
.res-tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.sec{display:grid;gap:14px}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-h .k{font-family:var(--f-display);font-size:13px;color:var(--gold);font-weight:700;letter-spacing:.06em}
.sec-h h2{font-size:21px}
.sec-h .sub{font-size:13px;color:var(--muted)}
.profile{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.profile>div{padding:12px 14px;border-bottom:1px solid var(--line);border-inline-start:1px solid var(--line);margin-inline-start:-1px;min-width:0}
.profile dt{font-size:12px;color:var(--muted)}
.profile dd{margin:0;font-weight:500}
.prio{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.pcol{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface);display:grid;gap:10px;align-content:start;min-width:0}
.pcol h3{font-size:16px;display:flex;gap:8px;align-items:center}
.pcol ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.pcol li{font-size:15px;line-height:1.6;padding-inline-start:12px;border-inline-start:2px solid var(--line)}
.pcol.c li{border-color:var(--rust)}
.pcol.v li{border-color:var(--gold-fill)}
.pcol li small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.path{display:grid;gap:12px;border:1px solid var(--gold-fill);border-radius:var(--r);padding:18px;background:var(--surface)}
.path-badges{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pbadge{font-family:var(--f-display);font-weight:600;background:var(--gold-fill);color:var(--on-gold);border-radius:6px;padding:4px 12px;font-size:15px}
.pbadge.alt{background:transparent;color:var(--gold);border:1px solid var(--gold-fill)}
.plus{color:var(--muted)}
.mods{display:grid;gap:12px}
.mod{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.mod summary{list-style:none;cursor:pointer;padding:16px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start}
.mod summary::-webkit-details-marker{display:none}
.mod-title{font-family:var(--f-display);font-weight:600;font-size:17px}
.mod-en{display:block;font-size:13px;color:var(--muted);font-weight:400;font-family:var(--f-body)}
.mod-meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.tag{border:1px solid var(--line);border-radius:4px;padding:1px 8px}
.tag.dep{border-color:var(--gold-fill);color:var(--gold)}
.tag.val{border-color:var(--rust);color:var(--rust)}
.chev{font-size:13px;color:var(--gold);white-space:nowrap}
.mod[open] .chev .o{display:none}
.mod:not([open]) .chev .c{display:none}
.mod-body{padding:0 16px 18px;display:grid;gap:16px;border-top:1px solid var(--line);padding-top:16px}
.mod-body p{max-width:68ch}
.mod-body h4{margin:0;font-size:14px;color:var(--gold);font-family:var(--f-display);font-weight:600}
.mod-body ul,.mod-body ol{margin:0;padding-inline-start:20px;display:grid;gap:6px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.kv>div{min-width:0}
.note{border-inline-start:3px solid var(--gold-fill);background:var(--gold-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:15px}
.note.warn{border-color:var(--rust);background:var(--rust-soft)}
.chip{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;font-family:var(--f-display);white-space:nowrap}
.chip.urgent{background:var(--rust);color:#FFF8F2}
.chip.important{background:var(--gold-fill);color:var(--on-gold)}
.chip.later{background:transparent;border:1px solid var(--line);color:var(--muted)}

/* action map */
.amap-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.amap{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6}
.amap th{font-family:var(--f-display);font-weight:600;text-align:start;font-size:12px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.amap td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
.amap tr:last-child td{border-bottom:0}
.amap td.issue{font-weight:500;min-width:180px}
.amap .chip{justify-self:start}
.amap .mname{display:block;font-size:12px;color:var(--gold);font-weight:600;margin-bottom:2px}
@media (max-width:820px){
  .amap-wrap{border:0;background:transparent;overflow:visible}
  table.amap,.amap tbody,.amap tr,.amap td{display:block;width:100%}
  .amap thead{display:none}
  .amap tr{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:12px;padding:6px 0}
  .amap td{border:0;padding:8px 14px;display:grid;grid-template-columns:96px 1fr;gap:10px}
  .amap td>div{min-width:0}
  .amap td::before{content:attr(data-l);font-size:12px;color:var(--muted);font-family:var(--f-display);font-weight:600}
  .amap td.issue{min-width:0}
}
.steps3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;counter-reset:s}
.step{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface);display:grid;gap:8px;align-content:start;min-width:0}
.step .n{font-family:var(--f-display);font-weight:700;color:var(--gold);font-size:22px;line-height:1}
.step small{color:var(--muted)}
.resgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.resitem{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface);display:grid;gap:6px;min-width:0;align-content:start}
.resitem h3{font-size:16px}
.resitem .en{font-size:12px;color:var(--gold);letter-spacing:.08em}
.resitem p{font-size:14px;color:var(--muted)}
.resitem ul{margin:0;padding-inline-start:18px;font-size:14px}
.scope{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.scope>div{border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.scope ul{margin:6px 0 0;padding-inline-start:18px;display:grid;gap:4px;font-size:15px}
.consult{border:1px dashed var(--gold-fill);border-radius:var(--r);padding:16px 18px;display:grid;gap:8px}
.consult .num{font-family:var(--f-body);direction:ltr;unicode-bidi:isolate;user-select:all;font-weight:600}
details.excl{font-size:14px;color:var(--muted)}
details.excl summary{cursor:pointer}
details.excl ul{margin:8px 0 0;padding-inline-start:18px}
.copybox{display:grid;gap:8px}
.copybox textarea{width:100%;min-height:220px;font:inherit;font-size:13px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:360px;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 16px;text-align:center;font-size:14px;z-index:20}
.foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px;justify-content:space-between}
@media (max-width:520px){
  .brand-tag{display:none}
  .designation{display:block}
  .lockup{height:28px}
  .q-nav .btn{flex:1 1 auto}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

/* v0.2 additions */
.ver{font-size:12px;color:var(--muted);align-self:center;white-space:nowrap}
.small-muted{font-size:14px;color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums;white-space:nowrap}
.badge-draft{display:inline-block;font-size:11px;line-height:1.5;padding:1px 8px;border-radius:4px;border:1px dashed var(--muted);color:var(--muted);font-family:var(--f-body);white-space:nowrap}
.draft-line{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.conf{border-radius:8px;padding:10px 14px;font-size:14px;border:1px solid var(--line);background:var(--surface)}
.conf-high{border-color:var(--ok)}
.conf-medium{border-color:var(--gold-fill)}
.conf-low{border-color:var(--rust);background:var(--rust-soft)}
.conflict{border:1px solid var(--gold-fill);background:var(--gold-soft);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px}
.conflict ul{margin:0;padding-inline-start:18px;display:grid;gap:8px}
.conflict small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.why{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--bg)}
.why ul{margin:6px 0 0;padding-inline-start:18px;display:grid;gap:6px;font-size:14px}
.why small{display:block;color:var(--muted);font-size:13px}
.govbox{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.govbox .val{color:var(--rust)}
.govbox details{flex-basis:100%}
.govbox summary{cursor:pointer}
.govbox ul{margin:6px 0 0;padding-inline-start:18px;display:grid;gap:4px}
.meta-kv{font-size:14px;color:var(--muted)}
details.excl li{margin-bottom:8px}
.contact{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center}
.contact a{color:var(--gold)}
.num{font-family:var(--f-body);direction:ltr;unicode-bidi:isolate;user-select:all;font-weight:600}
.mini{font-size:12px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:2px 10px;cursor:pointer;color:var(--ink);min-height:28px}
.mini:hover{border-color:var(--gold-fill)}
.foot{align-items:center}

/* print view: forced light, report layout */
:root.is-print{
  --bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F4F1E8;--ink:#07090D;--muted:#4D4A42;--line:#D6CFBE;
  --gold:#7A5812;--gold-fill:#D9A93F;--gold-soft:#F7EED7;--rust:#A8532A;--rust-soft:#F6E5DB;--ok:#3F6B4A;--logo:#07090D;--shadow:none;
  color-scheme:light;
}
:root.is-print .printview .mod summary{cursor:default}
:root.is-print .printview .sec{break-inside:auto}
:root.is-print .printview .mod,:root.is-print .printview .step,:root.is-print .printview .pcol{break-inside:avoid}
:root.is-print .bar-actions .ghost{display:none}
:root.is-print .printview .chev{display:none}
@media print{
  :root:not(#_){
    --bg:#FFFFFF;--surface:#FFFFFF;--surface-2:#F4F1E8;--ink:#07090D;--muted:#4D4A42;--line:#CFC7B4;
    --gold:#7A5812;--gold-fill:#D9A93F;--gold-soft:#F7EED7;--rust:#A8532A;--rust-soft:#F6E5DB;--logo:#07090D;color-scheme:light;
  }
  body{font-size:11pt}
  .bar-actions,.noprint,.res-tools,#copyFallback,.chev,.mini,.toast,.demo,.q-nav{display:none!important}
  .app{max-width:none;padding-inline:0}
  details>*{display:block}
  details:not([open]) .mod-body{display:grid!important}
  .mod,.step,.pcol,.amap tr,.resitem{break-inside:avoid}
  .amap-wrap{overflow:visible}
  a{color:inherit;text-decoration:none}
  @page{margin:14mm}
}

/* v0.3 client result */
.qwhy{margin-top:8px;font-size:14px;color:var(--muted)}
.qwhy summary{cursor:pointer;color:var(--gold);font-weight:600;width:max-content}
.qwhy p{margin-top:6px;max-width:60ch}
.findings{display:grid;gap:16px}
.finding{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:18px;display:grid;gap:12px;min-width:0}
.finding.compact{background:var(--bg)}
.f-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.f-head h3{font-size:19px;font-weight:600}
.ord{display:inline-block;font-family:var(--f-display);font-weight:700;font-size:12px;border-radius:999px;padding:2px 12px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);white-space:nowrap}
.ord-0{background:var(--gold-fill);border-color:var(--gold-fill);color:var(--on-gold)}
.ord-1{background:var(--gold-soft);border-color:var(--gold-fill)}
.f-order{font-size:14px;color:var(--muted);margin-top:-4px}
.f-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 20px}
.f-grid>div{min-width:0}
.f-grid h4,.more h4,.cat h3{margin:0 0 4px;font-size:14px;color:var(--gold);font-family:var(--f-display);font-weight:600}
.f-grid p{font-size:15px}
.f-grid ul{margin:0;padding-inline-start:18px;font-size:14px;display:grid;gap:4px}
.f-first{margin-top:6px;font-size:14px!important;background:var(--gold-soft);border-radius:6px;padding:6px 10px}
details.more summary,details.others>summary{cursor:pointer;color:var(--gold);font-weight:600;font-family:var(--f-display)}
.more-body{display:grid;gap:12px;padding-top:10px}
.more-body ul,.more-body ol{margin:0;padding-inline-start:20px;display:grid;gap:4px;font-size:14px}
details.others{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface)}
.others-body{display:grid;gap:14px;padding-top:12px}
.others-body ul{margin:0;padding-inline-start:18px;display:grid;gap:6px}
.critical{border:2px solid var(--rust);background:var(--rust-soft);border-radius:var(--r);padding:16px 18px;display:grid;gap:8px}
.critical h2{font-size:19px;color:var(--rust)}
.critical ul{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.critical li{border-inline-start:3px solid var(--rust);padding-inline-start:12px}
.critical li p{font-size:15px;margin-top:2px}
.critical small{color:var(--muted);font-size:13px}
.critical .st{font-size:12px;color:var(--rust);font-weight:600}
.verify-first{border:1px solid var(--gold-fill);border-radius:var(--r);padding:14px 16px;display:grid;gap:6px;background:var(--surface)}
.verify-first small{color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.cat{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface);display:grid;gap:6px;min-width:0}
.cat h3{font-size:16px}
.cat ul{margin:0;padding-inline-start:18px;font-size:14px;display:grid;gap:4px}
.vlist,.mlist{margin:0;padding-inline-start:20px;display:grid;gap:10px}
.vlist small{display:block;color:var(--muted);font-size:13px}
.scope p{font-size:14px;color:var(--muted)}
.release{font-size:12px;color:var(--muted);display:grid;gap:2px}
.philo-foot{font-size:12px;color:var(--gold)}
.foot{flex-direction:column;align-items:flex-start;gap:8px}
.c-item{display:inline-flex;gap:6px;align-items:center;margin-inline-end:12px}
.mail{font-family:var(--f-body);direction:ltr;unicode-bidi:isolate;user-select:all}
@media print{ details.others>*{display:block} .others-body{display:grid!important} }
.recur{border:1px solid var(--gold-fill);border-radius:8px;padding:12px 14px;background:var(--bg);display:grid;gap:8px}
.recur h4{margin:0;font-size:15px;color:var(--gold);font-family:var(--f-display)}
.recur ol{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.recur li{border-inline-start:3px solid var(--gold-fill);padding-inline-start:10px}
.recur li p{font-size:14px}
.recur small{color:var(--muted);font-size:13px}
/* final edition */
.cause{border-inline-start:3px solid var(--gold-fill);padding-inline-start:10px}
.cause .tag-h{font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 6px;margin-inline-start:6px;white-space:nowrap}
.f-mon ul{margin:0;padding-inline-start:18px;font-size:14px;display:grid;gap:4px}
.gloss dl{margin:0;display:grid;gap:8px}
.gloss dt{font-weight:600;font-family:var(--f-body);direction:ltr;unicode-bidi:isolate;text-align:start}
.gloss dd{margin:0;font-size:14px;color:var(--muted)}
.topline{border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:14px;background:var(--surface)}
.topline.warn{border-color:var(--rust);background:var(--rust-soft)}
.topline a{color:var(--gold)}
@media (max-width:820px){ .amap td{grid-template-columns:118px 1fr} }
/* lead capture + WhatsApp CTA */
.lform{display:grid;gap:14px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 16px}
.lfield{display:grid;gap:6px;min-width:0;align-content:start}
.lfield label{font-weight:600;font-size:15px}
.lfield .req{color:var(--rust)}
.lopt{font-weight:400;font-size:13px;color:var(--muted)}
.lfield input,.lfield select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 12px;min-height:46px;width:100%;min-width:0}
.lfield input:focus,.lfield select:focus{border-color:var(--gold-fill)}
.lfield.invalid input,.lfield.invalid select{border-color:var(--rust);background:var(--rust-soft)}
.err{color:var(--rust);font-size:13.5px;font-weight:600}
.lcheck{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:14.5px}
.lcheck input{width:20px;height:20px;margin-top:3px;accent-color:var(--gold-fill)}
.lcheck.invalid label{color:var(--rust)}
.privacy{font-size:13px;color:var(--muted);border-inline-start:3px solid var(--line);padding-inline-start:10px}
.lead-head{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.lead-head strong{color:var(--ink)}
.refno .en{font-weight:600;color:var(--ink);letter-spacing:.04em}
.cta{border:1px solid var(--gold-fill);border-radius:var(--r);padding:18px;background:var(--surface)}
.wa-row{display:flex}
.wa-btn{width:100%;white-space:normal;text-align:center;line-height:1.5;padding:14px 20px}
.wa-note{font-size:13.5px;color:var(--muted);text-align:center}
.wa-fallback textarea{width:100%;font:inherit;font-size:14px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
.offer{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background:var(--surface-2);display:grid;gap:8px}
.offer h3{font-size:17px}
.offer-name{font-size:12.5px;color:var(--gold);letter-spacing:.04em}
.offer ul{margin:0;padding-inline-start:20px;display:grid;gap:4px;font-size:14.5px}
.offer .price{font-size:15px}
.wa-status{font-size:14px;padding:10px 12px;border-radius:8px;background:var(--gold-soft);color:var(--ink)}
.wa-status.blocked{background:var(--rust-soft);border-inline-start:3px solid var(--rust)}
.wa-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.wa-tools .btn{text-decoration:none}
.print-contact{display:none}
.print-contact bdi{white-space:nowrap}
:root.is-print .print-contact{display:block;border-top:1px solid var(--line);padding-top:10px;font-size:13px;color:var(--muted)}
@media print{ .print-contact{display:block!important} #nextStep{display:none!important} }
</style>

  ranked.forEach(function(k){
    if(sev[k]==='later') return;
    (MODULES[k].depends||[]).forEach(function(d){
      var st = depStatus(d,A);
      if(st==='yes' || st==='na') return;
      if(st==='unknown'){ depVerify.push({d:d,k:k}); return; }
      if(st==='no' && MODULES[k].dependsMode!=='parallel'){
        (hard[d]=hard[d]||[]).push(k);
        if(set.indexOf(d)===-1){ set.push(d); sev[d]=sev[k]; }
        else if(ORDER[sev[d]]>ORDER[sev[k]]) sev[d]=sev[k];
        depNote[d]=(depNote[d]||[]).concat('أساس لازم قبل «'+MODULES[k].title+'»، لأن «'+rowOf(d)+'» عندك: مش موجود.');
        return;
      }
      // partial
      if(set.indexOf(d)===-1){ set.push(d); sev[d]=sev[k]; softAdded[d]=k;
        depNote[d]=(depNote[d]||[]).concat('اتضافت جنب «'+MODULES[k].title+'»، لأن «'+rowOf(d)+'» عندك: جزئياً. ابدأهم مع بعض.'); }
      else if(ORDER[sev[d]]>ORDER[sev[k]]){ sev[d]=sev[k];
        depNote[d]=(depNote[d]||[]).concat('أولويتها اترفعت لمستوى «'+MODULES[k].title+'» لأنها بتعتمد عليها.'); }
    });
  });
  function rowOf(d){ var c=DEP_STATUS[d]; return c ? rowLabel(c.row) : MODULES[d].title; }
  if(confidence==='low') set.forEach(function(k){ if(sev[k]==='urgent') sev[k]='important'; });

  // ordering: severity, main path, score; hard prerequisites placed before, soft right after
  var base = set.slice().sort(function(a,b){
    return (ORDER[sev[a]]-ORDER[sev[b]]) || (inPath(b,mainPath)-inPath(a,mainPath)) || (scores[b]-scores[a]);
  });
  var out = [];
  function place(k){
    if(out.indexOf(k)>-1) return;
    Object.keys(hard).forEach(function(d){ if(hard[d].indexOf(k)>-1) place(d); });
    (MODULES[k].after||[]).forEach(function(d){ if(set.indexOf(d)>-1) place(d); });
    if(forced[k] && set.indexOf(forced[k].after)>-1) place(forced[k].after);
    out.push(k);
    Object.keys(softAdded).forEach(function(d){ if(softAdded[d]===k) place(d); });
  }
  base.forEach(function(k){ if(softAdded[k] && out.indexOf(softAdded[k])===-1) return; place(k); });
  base.forEach(place);

  // why included
  var whyIn = {};
  out.forEach(function(k){
    var list = reasons[k].map(function(r){ return {t:r.t, why:r.why, answer:true}; });
    (depNote[k]||[]).forEach(function(n){ list.push({t:n, why:''}); });
    if(confidence==='low') list.push({t:'الثقة منخفضة: الأولوية متحطة «مهم» مش «عاجل» لحد ما التحقق يخلص.', why:''});
    whyIn[k]=list;
  });
  // why excluded
  var whyOut = {};
  Object.keys(MODULES).forEach(function(k){
    if(out.indexOf(k)>-1) return;
    var m = MODULES[k], list = [];
    (m.excludeWhen||[]).forEach(function(x){ if(test(x.when,A)) list.push(x.text); });
    if(capped.indexOf(k)>-1) list.push('ليها إشارات واضحة، بس اتأجلت عشان الخطة ما تزيدش عن '+SETTINGS.maxModules+' محاور في نفس الوقت.');
    depVerify.forEach(function(x){ if(x.d===k) list.push('«'+MODULES[x.k].title+'» بتعتمد عليها، بس إنت مش متأكد إذا كانت موجودة. اتأكد الأول قبل ما نضيفها.'); });
    if(!list.length && scores[k]>0) list.push('في إشارات قليلة بس في كلامك ('+reasons[k].map(function(r){return r.t;}).join('؛ ')+')، مش كفاية نحطها في الخطة دلوقتي.');
    if(!list.length) list.push('مفيش في إجاباتك حاجة بتشاور عليها.');
    whyOut[k]=list;
  });

  // verify / maybe
  var verify=[], maybe=[];
  conflicts.forEach(function(c){ if(c.verify) verify.push(c.verify); });
  unknowns.forEach(function(u){ verify.push(UNKNOWN_VERIFY[u]); });
  depVerify.forEach(function(x){ verify.push({t:'«'+MODULES[x.k].title+'» بتعتمد على «'+MODULES[x.d].title+'»، وإنت مش متأكد إذا كانت موجودة.', how:'اتأكد الأول قبل ما تبدأ: '+UNKNOWN_VERIFY[DEP_STATUS[x.d].row].how}); });
  INSIGHT_RULES.forEach(function(r){ if(test(r.when,A)){ if(r.verify) verify.push(r.verify); if(r.maybe) maybe.push(r.maybe); } });

  // root-cause categories (signals, never a verdict)
  var cats = {};
  CATEGORY_RULES.forEach(function(r){ if(test(r.when,A)){ (cats[r.cat]=cats[r.cat]||[]).push(describe(r.when,A)); } });
  var catList = Object.keys(cats).map(function(k){ return {k:k, ev:cats[k].filter(function(x,i,a){return x && a.indexOf(x)===i;})}; })
    .sort(function(a,b){ return (b.ev.length-a.ev.length) || (Object.keys(CATEGORIES).indexOf(a.k)-Object.keys(CATEGORIES).indexOf(b.k)); });
  // must-fix / specialist items
  var critical = CRITICAL_RULES.filter(function(r){ return test(r.when,A); }).map(function(r){
    var st = r.when.row && A[r.when.q] ? A[r.when.q][r.when.row] : null;
    return {id:r.id, level:r.level, t:r.t, action:r.action, owner:r.owner, by:r.by, status: st ? colLabel(st, r.when.q) : ''};
  });
  // why this order
  var reasonOrder = {};
  out.forEach(function(k){
    var bits = [];
    if(hard[k]) bits.push('قبل «'+hard[k].map(function(x){return RESULT_TEXT[x].finding;}).join('» و«')+'»: لأنها الأساس اللي بيقف عليه.');
    out.forEach(function(x){ if((MODULES[x].after||[]).indexOf(k)>-1) bits.push('قبل «'+RESULT_TEXT[x].finding+'»: الحفر تتسد الأول.'); });
    (MODULES[k].after||[]).forEach(function(d){ if(out.indexOf(d)>-1) bits.push('بعد «'+RESULT_TEXT[d].finding+'».'); });
    if(softAdded[k]) bits.push('جنب «'+RESULT_TEXT[softAdded[k]].finding+'»: ابدأهم مع بعض.');
    if(forced[k]) bits.push(forced[k].order);
    if(A.primary && PRIMARY_MODULE[A.primary]===k) bits.push('دي أكتر حاجة قلت إنها بتوجعك.');
    if(!bits.length) bits.push(sev[k]==='urgent' ? 'إجابات كتير منك بتشاور عليها.' : sev[k]==='important' ? 'مهمة، بس بعد اللي قبلها.' : 'تستنى لحد ما اللي قبلها يثبت.');
    reasonOrder[k] = bits.join(' ');
  });
  return { forced:forced, A:A, pathway:pr, scores:scores, modules:out, severity:sev, hard:hard, softAdded:softAdded, cats:catList, critical:critical, reasonOrder:reasonOrder,
    whyIn:whyIn, whyOut:whyOut, verify:verify, maybe:maybe, conflicts:conflicts, confidence:confidence, unknowns:unknowns };
}

function actionFor(k, A){

function evidenceFor(k, R){

/* likely cause for one finding: the strongest matching cause from the answers, else the default hypothesis */
function causeFor(k, R){
  var rel = CAUSE_RELEVANCE[k]||[];

function confirmedList(A){
  var out=[];
  if(A.primary) out.push(label('primary',A.primary));
  labels('secondary',A.secondary).forEach(function(t){ out.push(t); });
  ['serviceDetail','gxSignals','competency','governance','authority'].forEach(function(q){ labels(q,A[q]).forEach(function(t){ out.push(t); }); });
  if(A.complaintFix==='returned') out.push(label('complaintFix','returned'));
  if(A.fsLevel) out.push(label('fsLevel',A.fsLevel));
  ['systems','costState'].forEach(function(qid){ if(A[qid]) QMAP[qid].rows.forEach(function(r){ if(A[qid][r.v]==='no') out.push('مش موجود: '+r.t); }); });
  if(A.costSwing==='yes') out.push(label('costSwing','yes'));
  if(isArr(A.ready)){
    var miss = QMAP.ready.options.filter(function(o){return !o.exclusive && A.ready.indexOf(o.v)===-1;}).map(function(o){return o.t;});
    if(miss.length) out.push('لسه مش جاهز: '+miss.join('، '));
  }
  return out;
}

/* ---------- lead capture + WhatsApp conversion ---------- */
var ROLE_FROM_DIAG = { owner:'owner', gm:'gm', manager:'manager', ops:'ops', supervisor:'supervisor' };
function emptyLead(){ return {name:'', restaurant:'', phone:'', role:'', branches:'', email:'', consentContact:false, consentMarketing:false}; }
/* pre-fill role and branch count from the diagnostic answers (once), so nothing is asked twice */
function prefillLead(){
  if(state.prefilled) return;
  var A = effective(state.answers), L = state.lead;
  if(!L.role && A.role && ROLE_FROM_DIAG[A.role]) L.role = ROLE_FROM_DIAG[A.role];
  if(!L.branches){
    if(A.stage==='new') L.branches='opening';
    else if(A.stage==='existing') L.branches='1';
    else if(A.branches) L.branches=A.branches;
  }
  state.prefilled = true;
}
function branchesDerived(){ var A=effective(state.answers); return !!(A.stage && (A.stage==='new'||A.stage==='existing'||A.branches)); }
function optLabel(list, v){ var o=list.filter(function(x){return x.v===v;})[0]; return o?o.t:''; }

/* phone: Egyptian mobile 01[0125]XXXXXXXX, +20…, 0020…, or any international number starting with + / 00 and 8–15 digits */
function normalizePhone(raw){
  var s = String(raw||'').replace(/[\s\-().‎‏]/g,'');
  // Arabic-Indic digits → Latin
  s = s.replace(/[٠-٩]/g, function(d){ return String(d.charCodeAt(0)-0x0660); }).replace(/[۰-۹]/g, function(d){ return String(d.charCodeAt(0)-0x06F0); });
  if(!s) return {ok:false, empty:true};
  var m;
  if((m=/^01([0125]\d{8})$/.exec(s))) return {ok:true, digits:'201'+m[1]};
  if((m=/^(?:\+|00)201([0125]\d{8})$/.exec(s))) return {ok:true, digits:'201'+m[1]};
  if(/^(?:\+|00)20/.test(s)) return {ok:false};            // +20 / 0020 but not a valid Egyptian mobile
  if((m=/^(?:\+|00)(\d{8,15})$/.exec(s))) return {ok:true, digits:m[1]};
  return {ok:false};
}
function validEmail(e){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e); }
function validateLead(requireConsent){
  prefillLead();   // errors must match what the selects show
  var L = state.lead, E = {}, er = LEAD_FORM.errors;
  if(L.name.trim().length<2) E.name = er.name;
  if(L.restaurant.trim().length<2) E.restaurant = er.restaurant;
  var ph = normalizePhone(L.phone); if(!ph.ok) E.phone = ph.empty ? er.phoneEmpty : er.phoneBad;
  if(!L.role) E.role = er.role;
  if(!L.branches) E.branches = er.branches;
  if(L.email.trim() && !validEmail(L.email.trim())) E.email = er.email;
  ['name','restaurant','email'].forEach(function(k){ if(!E[k] && L[k].trim().length > LEAD_FORM.maxLen[k]) E[k] = er.tooLong.replace('{n}', LEAD_FORM.maxLen[k]); });
  if(requireConsent && !L.consentContact) E.consent = er.consent;
  return E;
}
function leadComplete(){ return Object.keys(validateLead(false)).length===0; }

/* reference: SEEMA-YYMMDD-XXXX = date + a hash of the answers (same answers, same day → same reference).
   It changes when the answers change and is shown on the result, in print, in the copied plan and in the message. */
function canon(v){
  if(v===null || typeof v!=='object') return JSON.stringify(v);
  if(isArr(v)) return '['+v.map(canon).join(',')+']';
  return '{'+Object.keys(v).sort().map(function(k){ return JSON.stringify(k)+':'+canon(v[k]); }).join(',')+'}';
}
function hash32(str){ var h=0x811c9dc5; for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; } return h>>>0; }
function ensureRef(){
  var key = canon(state.answers);
  if(state.ref && state.refKey===key) return state.ref;
  var abc='ABCDEFGHJKMNPQRSTUVWXYZ23456789', d=new Date(), h=hash32(key), x='', i;
  for(i=0;i<4;i++){ x+=abc[h%abc.length]; h=Math.floor(h/abc.length); }
  function p2(n){ return (n<10?'0':'')+n; }
  state.ref = 'SEEMA-'+String(d.getFullYear()).slice(2)+p2(d.getMonth()+1)+p2(d.getDate())+'-'+x;
  state.refKey = key;
  return state.ref;
}

/* findings used by the message and the lead object: the same top 3 the screen shows, same order, no duplicates */
function leadFindings(){
  if(state.screen==='escalation') return [];
  var R = analyse(state.answers), A = R.A, out = [], seen = [];
  R.modules.slice(0, SETTINGS.topProblems).forEach(function(k){
    var t = resultFor(k,A).finding; if(seen.indexOf(t)>-1) return; seen.push(t);
    out.push({id:k, title:t, priority:SEVERITY[R.severity[k]].t});
  });
  return out;
}
/* critical alert line: only when the food-safety escalation fired */
function criticalSummary(){
  if(state.screen!=='escalation') return '';
  var A = effective(state.answers);
  var hits = criticalSelected(A).map(function(h){ return ESCALATION.byType[h] ? ESCALATION.byType[h].t : ''; }).filter(Boolean);
  return 'خطر سلامة أكل حاصل دلوقتي'+(hits.length ? ' ('+hits.join('، ')+')' : '')+'.';
}
function waMessage(){ return waCompose().msg; }
/* Length guard (CONFIG.waMaxUrl). Arabic letters take 6 characters each in a URL, so wording shrinks step by step, only when needed:
   0 full wording · 1 shorter phrases · 2 one shared priority label when all findings share it ·
   3 shortest intro/closing · 4 without the email line (the email stays in the lead data).
   Name, restaurant, top-3 titles in order, priority, critical line, role, branches and reference are never dropped. */
var WA_LEVELS = 4;
function waCompose(){
  var lvl, msg;
  for(lvl=0; lvl<=WA_LEVELS; lvl++){ msg = waBuild(lvl); if(waUrl(msg).length <= CONFIG.waMaxUrl) break; }
  return { msg:msg, level:Math.min(lvl, WA_LEVELS) };
}
function waBuild(lvl){
  var L = state.lead, f = leadFindings(), crit = criticalSummary(), M = [],
      T = lvl>=3 ? WA_TEXT.shortest : (lvl>=1 ? WA_TEXT.short : WA_TEXT);
  var same = lvl>=2 && f.length>1 && f.every(function(x){ return x.priority===f[0].priority; });
  M.push(WA_TEXT.hello.replace('{name}', L.name.trim()).replace('{restaurant}', L.restaurant.trim()));
  M.push(T.intro);
  if(crit){ M.push(''); M.push('⚠️ تنبيه حرج: '+crit); }
  if(f.length){ M.push(''); M.push(same ? T.findingsHead.replace(/:$/, ' ('+f[0].priority+'):') : T.findingsHead);
    f.forEach(function(x,i){ M.push((i+1)+'. '+x.title+(same ? '' : ' ('+x.priority+')')); }); }
  M.push('');
  M.push('عدد الفروع: '+optLabel(LEAD_FORM.branches, L.branches));
  M.push('الوظيفة: '+optLabel(LEAD_FORM.roles, L.role));
  if(L.email.trim() && lvl<4) M.push('الإيميل: '+L.email.trim());
  M.push('رقم التشخيص: '+ensureRef());
  M.push('');
  M.push(T.closing);
  return M.join('\n');
}
function waUrl(msg){ return 'https://wa.me/'+CONFIG.whatsappNumber+'?text='+encodeURIComponent(msg); }

/* lead payload (schema in ADMIN.md). Never sent anywhere unless CONFIG.leadEndpoint is set. */
function buildLead(){
  var L = state.lead, ph = normalizePhone(L.phone), f = leadFindings(), esc_ = state.screen==='escalation';
  var R = analyse(state.answers), A = R.A, sum = { screen: esc_ ? 'escalation' : 'results' };
  ['role','stage','concept','branches','openWhen','outcome','timeframe','support'].forEach(function(q){ if(A[q]!=null && A[q]!=='') sum[q] = label(q, A[q]); });
  if(!esc_){ sum.pathway = R.pathway.paths.join('+'); sum.confidence = R.confidence; sum.mustFixBeforeOpening = R.critical.map(function(c){ return c.t; }); }
  return {
    ref: ensureRef(), createdAt: new Date().toISOString(),
    contact:{ name:L.name.trim(), restaurant:L.restaurant.trim(), whatsapp:ph.ok?ph.digits:'', role:L.role, roleLabel:optLabel(LEAD_FORM.roles,L.role),
              branches:L.branches, branchesLabel:optLabel(LEAD_FORM.branches,L.branches), email:L.email.trim() },
    consent:{ contact:!!L.consentContact, marketing:!!L.consentMarketing, timestamp:state.consentAt || null },
    findings: f.map(function(x){ return {id:x.id, title:x.title, priority:x.priority}; }),
    critical: !!criticalSummary(),

  };
}

function restart(){ state.answers={}; state.history=[]; state.current=null; resetLead(); go('start'); }
function begin(){ state.answers={}; state.history=[]; state.current=QUESTIONS[0].id; resetLead(); go('quiz'); }
function loadScenario(id){
  var s = SCENARIOS.filter(function(x){return x.id===id;})[0]; if(!s) return;
  resetLead();
  state.answers = JSON.parse(JSON.stringify(s.answers));
  var vis = visibleQuestions(state.answers), A = effective(state.answers);
  var crit = vis.filter(function(q){ return isCritical(q, A[q]); })[0];
  if(crit){ state.history = vis.slice(0, vis.indexOf(crit)); state.current = crit; go('escalation'); return; }
  state.current = vis[vis.length-1]; state.history = vis.slice(0,-1); go('results');
}

document.addEventListener('click', function(e){
  var t = e.target.closest('button'); if(!t || !root.contains(t)) return;
  var act = t.getAttribute('data-act');
  if(act==='restart') return restart();
  if(act==='begin') return begin();
  if(act==='next') return advance();
  if(act==='back'){ if(state.screen==='escalation'){ go('quiz'); return; } return back(); }
  if(act==='waSend') return sendWhatsApp();
  if(act==='copyWaMsg'){ var ta=document.getElementById('waMsg'); return copyText(ta?ta.value:waMessage(), null, 'waCopyFallback'); }
  if(act==='copy') return copyText(planText());
  if(act==='copyEsc') return copyText(escalationText());
  if(act==='copyTxt') return copyText(t.getAttribute('data-copy'), t.getAttribute('data-target'));
  if(act==='edit') return editAnswers();
  if(act==='printOn'){ setPrint(true); render(); try{ window.scrollTo(0,0); }catch(err){} return; }
  if(act==='printOff'){ setPrint(false); render(); return; }
  if(state.screen!=='quiz') return;
  var q = QMAP[state.current];
  if(t.hasAttribute('data-opt')){
    var v = t.getAttribute('data-opt');
    if(q.type==='single'){
      state.answers[q.id]=v; render();
      var crit = isCritical(q.id, v);
      var delay = (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) ? 0 : 160;
      setTimeout(function(){ if(state.screen==='quiz' && state.current===q.id) advance(); }, crit?0:delay);
      return;
    }
    if(q.type==='multi'){
      if(t.getAttribute('aria-disabled')==='true') return;
      var arr = isArr(state.answers[q.id]) ? state.answers[q.id].slice() : [];
      var i = arr.indexOf(v);
      if(i>-1) arr.splice(i,1);
      else if(excl(q,v)) arr=[v];
      else { arr = arr.filter(function(x){return !excl(q,x);}); if(arr.length<q.max) arr.push(v); }
      state.answers[q.id]=arr; render();
      var b=view.querySelector('[data-opt="'+v+'"]'); if(b) b.focus(); return;
    }
  }
  if(t.hasAttribute('data-row')){
    var m = Object.assign({}, state.answers[q.id]||{}); m[t.getAttribute('data-row')]=t.getAttribute('data-col');
    state.answers[q.id]=m; render();
    var bb = view.querySelector('[data-row="'+t.getAttribute('data-row')+'"][data-col="'+t.getAttribute('data-col')+'"]'); if(bb) bb.focus();
  }
});
